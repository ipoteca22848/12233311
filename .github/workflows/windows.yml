name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller==6.12.0
      - run: python -m unittest discover -s tests
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name ChessHelper app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-Windows
          path: dist/ChessHelper.exe
